[package]
name = "dnsy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Blocklists fetched from persisted list sources on a schedule (pulls the HTTP and TLS client).
fetch = ["dnsy-filter/fetch"]

[dependencies]
dnsy-config = { version = "0.1.0", path = "../dnsy-config" }
dnsy-core = { version = "0.1.0", path = "../dnsy-core" }
dnsy-dnssec = { version = "0.1.0", path = "../dnsy-dnssec" }
dnsy-keys = { version = "0.1.0", path = "../dnsy-keys" }
dnsy-filter = { version = "0.1.0", path = "../dnsy-filter" }
dnsy-observe = { version = "0.1.0", path = "../dnsy-observe" }
dnsy-proto = { version = "0.1.0", path = "../dnsy-proto" }
dnsy-resolver = { version = "0.1.0", path = "../dnsy-resolver" }
dnsy-store = { version = "0.1.0", path = "../dnsy-store" }
dnsy-zone = { version = "0.1.0", path = "../dnsy-zone" }
arc-swap = { workspace = true }
ipnet = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
dnsy-core = { version = "0.1.0", path = "../dnsy-core", features = ["test-util"] }
tempfile = { workspace = true }
