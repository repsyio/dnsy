[package]
name = "dnsy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
# Embed the web UI from web/dist (build it first: `just build`).
embed-ui = ["dnsy-api/embed-ui"]

[package.metadata.dist]
# `publish = false` hides the package from cargo-dist; opt back in (dist-workspace.toml).
dist = true

[[bin]]
name = "dnsy"
path = "src/main.rs"

[dependencies]
dnsy-api = { version = "0.1.0", path = "../dnsy-api" }
dnsy-auth = { version = "0.1.0", path = "../dnsy-auth" }
dnsy-config = { version = "0.1.0", path = "../dnsy-config" }
dnsy-core = { version = "0.1.0", path = "../dnsy-core" }
dnsy-dnssec = { version = "0.1.0", path = "../dnsy-dnssec" }
dnsy-engine = { version = "0.1.0", path = "../dnsy-engine" }
dnsy-filter = { version = "0.1.0", path = "../dnsy-filter" }
dnsy-observe = { version = "0.1.0", path = "../dnsy-observe" }
dnsy-proto = { version = "0.1.0", path = "../dnsy-proto" }
dnsy-resolver = { version = "0.1.0", path = "../dnsy-resolver" }
dnsy-server = { version = "0.1.0", path = "../dnsy-server" }
dnsy-store = { version = "0.1.0", path = "../dnsy-store" }
dnsy-zone = { version = "0.1.0", path = "../dnsy-zone" }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
zeroize = { workspace = true }

[dev-dependencies]
dnsy-core = { version = "0.1.0", path = "../dnsy-core", features = ["test-util"] }
http-body-util = { workspace = true }
dnsy-proto = { version = "0.1.0", path = "../dnsy-proto" }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
dnsy-config = { version = "0.1.0", path = "../dnsy-config" }

[lints]
workspace = true
