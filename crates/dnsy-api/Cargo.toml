[package]
name = "dnsy-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Serve the built Angular UI (web/dist/dnsy/browser) from the binary.
embed-ui = ["dep:rust-embed"]

[[bin]]
name = "gen-openapi"
path = "src/bin/gen-openapi.rs"

[dependencies]
axum = { workspace = true }
dnsy-auth = { version = "0.1.0", path = "../dnsy-auth" }
dnsy-core = { version = "0.1.0", path = "../dnsy-core" }
dnsy-proto = { version = "0.1.0", path = "../dnsy-proto" }
dnsy-store = { version = "0.1.0", path = "../dnsy-store" }
dnsy-zone = { version = "0.1.0", path = "../dnsy-zone" }
rand = { workspace = true }
rust-embed = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }
