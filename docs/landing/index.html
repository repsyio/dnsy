<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNSY</title>
<meta name="description" content="DNSY: a single-binary Rust DNS server with DoT, DoH, DNSSEC and a web UI.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="branding/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="branding/tokens.css">
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem 1rem;
    background: var(--dnsy-bg); color: var(--dnsy-text); font-family: var(--dnsy-font-body);
  }
  main { max-width: 40rem; }
  .nox { width: 10rem; height: 10rem; overflow: visible; animation: float 6s ease-in-out infinite; }
  .ln { fill: none; stroke: var(--dnsy-text); stroke-width: 0.5px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .dash { stroke-dasharray: 2 4; opacity: 0.45; }
  .eye { fill: none; stroke: var(--dnsy-red); stroke-width: 1px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .beak { fill: none; stroke: var(--dnsy-red); stroke-width: 0.5px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .eyes { animation: look 8s ease-in-out infinite; }
  h1 {
    font-family: var(--dnsy-font-display); font-weight: 400; font-size: 2.25rem; letter-spacing: 0.22em;
    margin: 1.5rem 0 0.75rem; padding-left: 0.22em; text-transform: uppercase;
  }
  p { color: var(--dnsy-muted); line-height: 1.6; margin: 0; }
  nav { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-top: 2.25rem; }
  a {
    color: var(--dnsy-red); border: 0.5px solid var(--dnsy-red); border-radius: 2px; padding: 0.7rem 1.2rem;
    text-decoration: none; font-family: var(--dnsy-font-display); font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; transition: background-color 0.15s, color 0.15s;
  }
  a:hover { background: var(--dnsy-red); color: var(--dnsy-bg); }
  a:focus-visible { outline: 2px solid var(--dnsy-red); outline-offset: 3px; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes look {
    0%, 30%, 100% { transform: translateX(0); }
    40%, 55% { transform: translateX(-5px); }
    65%, 80% { transform: translateX(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .nox, .eyes { animation: none; }
    a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <svg class="nox" viewBox="0 0 200 200" role="img" aria-label="Nox, the DNSY owl mascot">
    <path class="ln" d="M100 34 L146 20 L162 70 L152 140 L100 178 L48 140 L38 70 L54 20 Z"/>
    <path class="ln dash" d="M100 46 L138 34 L150 72 L141 133 L100 163 L59 133 L50 72 L62 34 Z"/>
    <path class="ln" d="M44 80 L100 98 L156 80"/>
    <g class="eyes"><path class="eye" d="M62 101.5 H88 M112 101.5 H138"/></g>
    <path class="beak" d="M93 108 L100 116 L107 108"/>
  </svg>
  <h1>DNSY</h1>
  <p>A single-binary DNS server in Rust. UDP, TCP, DoT with mTLS, DoH with tokens, a validating forwarder, DNSSEC signing, filtering and a web UI.</p>
  <nav>
    <a href="docs/">Documentation</a>
    <a href="rest-api/">REST API</a>
    <a href="api/dnsy_core/">Rust API docs</a>
    <a href="https://github.com/repsyio/dnsy">GitHub</a>
  </nav>
</main>
</body>
</html>
