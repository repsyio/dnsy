[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "hickory-proto" },
    { crate = "hickory-resolver" },
    { crate = "hickory-client" },
    { crate = "hickory-server" },
    { crate = "hickory-net" },
    { crate = "trust-dns-proto" },
    { crate = "trust-dns-resolver" },
    { crate = "trust-dns-client" },
    { crate = "trust-dns-server" },
    { crate = "domain" },
    { crate = "simple-dns" },
    { crate = "dns-parser" },
    { crate = "dnsclient" },
    { crate = "dnssec-prover" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
