[workspace]
resolver = "3"
members = ["crates/*", "tests/e2e", "tests/bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/repsyio/dnsy"
rust-version = "1.99"

[workspace.dependencies]
# Async runtime, sockets
socket2 = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
# TLS (ring provider, no OpenSSL)
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.10"
# HTTP server and client
axum = "0.8.9"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1.5"
tower = "0.5.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# OpenAPI
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
# Storage
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
# Serialization and config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
# Hot reload
notify = "8.2.0"
arc-swap = "1.9.3"
# Passwords, DNSSEC crypto primitives, tokens
argon2 = "0.6.0"
ring = "0.17.14"
zeroize = "1.9.1"
rand = "0.10.3"
sha2 = "0.11.1"
subtle = "2.6.1"
base64 = "0.23.1"
# IP/CIDR
ipnet = "2.12.2"
# Errors, logs, CLI
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# UI embedding
rust-embed = "8.13.0"
# Test-only
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rcgen = "0.14.10"
tempfile = "3.27.0"
insta = { version = "1.49.0", default-features = false }
criterion = "0.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true
# Keep unwind: the server has no catch_unwind, and abort would turn any panic reachable from
# hostile input into a whole-resolver outage instead of one failed connection task.
panic = "unwind"

# Profile used by cargo-dist for release artifacts (dist-workspace.toml). It adds nothing: every
# setting, including `panic = "unwind"`, comes from [profile.release] above.
[profile.dist]
inherits = "release"
