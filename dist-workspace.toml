[workspace]
members = ["cargo:."]

# Config for cargo-dist (https://opensource.axo.dev/cargo-dist/). Regenerate .github/workflows/release.yml
# with `dist generate` after editing; see docs/book/src/release.md.
[dist]
# The version of cargo-dist to use (pinned; CI installs exactly this release).
cargo-dist-version = "0.33.1"
# CI backend to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "pkg", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Release only the `dnsy` binary, with the web UI compiled in (web/dist is built in build-setup.yml first).
precise-builds = true
features = ["embed-ui"]
# Ship the annotated sample config as dnsy.toml in every archive (`dnsy config init` writes the same text).
include = ["examples/dnsy.toml"]
# Checksum every artifact (sha256) and publish a unified sha256.sum
checksum = "sha256"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Do not build on pull requests (CI does that); releases only run on version tags
pr-run-mode = "skip"
allow-dirty = ["ci"]
# Build prerequisites for every build job: node, pnpm, the web UI, musl-tools
github-build-setup = "../build-setup.yml"
# Extra jobs: run the embed-ui tests before any artifact is built
plan-jobs = ["./release-verify"]
# Native arm64 Linux runners (no cross-compilation). The gnu targets build inside manylinux_2_28
# containers so the binaries need glibc 2.28 or newer (RHEL 8+, Debian 10+, Ubuntu 20.04+); the
# container's `host` is the triple of the dist binary that runs in it (a static musl build).
[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }

# macOS .pkg installers (one per architecture); unsigned.
[dist.mac-pkg-config]
identifier = "dev.dnsy.dnsy"
