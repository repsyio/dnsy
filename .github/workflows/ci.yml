# CI mirrors `just ci` (see AGENTS.md); the recipes are called wherever possible so the pipeline and
# the local merge gate cannot drift apart. `e2e` and `e2e-ui` live in e2e.yml; the macOS and Windows
# build and the pkg/msi installers live in release-pre-check.yml.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  # `just check` (fmt --check, clippy -D warnings, cargo-deny, cargo-audit advisory, OpenAPI drift)
  # and `just cov-rust` (cargo llvm-cov nextest: runs the whole suite, then the coverage gates).
  rust:
    name: rust (linux)
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          # The self-hosted runners have no rustup; the GitHub-hosted macOS and Windows runners do.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-audit
      - run: just check
      # Skips with a clear message (instead of failing) on a runner without systemd-analyze.
      - name: Verify the systemd unit
        run: |
          if ! command -v systemd-analyze >/dev/null; then
            echo "systemd-analyze not found on this runner; skipping the unit check"
            exit 0
          fi
          # verify also checks that ExecStart exists, and dnsy is not installed on the runner:
          # point it at /bin/true in a scratch copy and keep everything else as written.
          unit="$(mktemp -d)/dnsy.service"
          sed -E 's#^ExecStart=[^ ]+#ExecStart=/bin/true#' examples/dnsy.service > "$unit"
          systemd-analyze verify "$unit"
      - run: just cov-rust
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-cov-html
          path: target/llvm-cov/html
          if-no-files-found: ignore
          retention-days: 7

  # The embedded-UI code paths are compiled out of the default build, so `just test` and
  # `just cov-rust` skip them (e.g. `ui_serves_brotli_when_accepted` returns early). Build the
  # web UI first (rust-embed reads web/dist/dnsy/browser), then run the API suite with the feature.
  embed-ui:
    name: rust (embed-ui)
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node first: the self-hosted runners ship an old system node that pnpm's installer cannot run
      # under, so Node 24 must be on the PATH before the pnpm action.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Install the pinned toolchain
        run: |
          # The self-hosted runners have no rustup; the GitHub-hosted macOS and Windows runners do.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: embed-ui
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo clippy -p dnsy-api -p dnsy --all-targets --features dnsy/embed-ui,dnsy-api/embed-ui -- -D warnings
      - run: cargo nextest run -p dnsy-api --features embed-ui
      - name: The brotli test must actually run with the feature on
        run: cargo nextest run -p dnsy-api --features embed-ui ui_serves_brotli_when_accepted --no-tests=fail

  # `just web`: pnpm install, dedupe check, ng lint + prettier, ng test --coverage (gate in
  # web/angular.json), ng build, OpenAPI types drift.
  web:
    name: web
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node first: the self-hosted runners ship an old system node that pnpm's installer cannot run
      # under, so Node 24 must be on the PATH before the pnpm action.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: just web
      - name: Audit npm dependencies (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level=high
        working-directory: web

  # Single required check for branch protection: `ci` passes only when every job above passed.
  ci:
    name: ci
    if: always()
    needs: [rust, embed-ui, web]
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
