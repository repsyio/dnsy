# Called by release.yml (plan-jobs in dist-workspace.toml) before any artifact is built:
# a tag whose embedded-UI tests fail never produces a release.
name: Release verify

on:
  workflow_call:
  # The step names a test by path; run it when that test or this file changes so it cannot drift.
  pull_request:
    paths:
      - .github/workflows/release-verify.yml
      - .github/build-setup.yml
      - dist-workspace.toml
      - scripts/check-glibc-floor.sh
      - crates/dnsy-api/**
      - web/**

permissions:
  contents: read

jobs:
  embed-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Embedded UI test (release profile settings, UI compiled in)
        run: |
          cargo test --release -p dnsy-api --features embed-ui --test guards -- ui_serves_brotli_when_accepted 2>&1 | tee test.log
          # A filter that matches nothing exits 0; make that a failure.
          grep -q 'test ui_serves_brotli_when_accepted ... ok' test.log

  # The gnu release targets build in manylinux_2_28 containers (dist-workspace.toml). Build the same
  # binary the same way (dist profile, embedded UI) and fail if it needs glibc newer than 2.28, so a
  # dependency or toolchain change that raises the floor stops the release before any artifact exists.
  glibc-floor:
    name: glibc-floor (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust non-interactively if not already installed
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          # The self-installer needs npm, which the manylinux aarch64 image lacks.
          standalone: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build dnsy (dist profile, embedded UI)
        run: cargo build --profile dist -p dnsy --features embed-ui
      - name: Check the glibc floor
        run: scripts/check-glibc-floor.sh target/dist/dnsy 2.28
