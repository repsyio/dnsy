# Checks that are too slow or too platform-specific to run on every pull request, run before a
# release instead: the macOS and Windows build and test, and the macOS .pkg and Windows .msi
# installers (built with cargo-dist and installed on a real runner). Nothing is published.
#
# It never runs on pull requests. It runs
#   * by hand: Actions, release-pre-check, Run workflow (do this on main and wait for green before
#     tagging a release, see docs/book/src/release.md; pick a branch to check a packaging change
#     before it merges),
#   * weekly on main, so a Windows or macOS break does not wait for release day.
# It is not a required check and the release workflow does not wait for it.
name: release-pre-check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: release-pre-check-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  # Build and unit-test on the other platforms. Coverage, deny, e2e and browser suites are
  # Linux-only; this only proves the workspace compiles and the unit/integration tests pass.
  cross-platform:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          # The self-hosted runners have no rustup; the GitHub-hosted macOS and Windows runners do.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      # The release builds the web UI on every platform; build it here on Windows too, where path
      # handling in the build scripts differs.
      - if: runner.os == 'Windows'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - if: runner.os == 'Windows'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: runner.os == 'Windows'
        name: Build the web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/dnsy/browser/index.html
      - run: cargo build --workspace --exclude dnsy-bench --all-targets
      - run: cargo nextest run --workspace --exclude dnsy-e2e --exclude dnsy-bench --no-tests=pass --no-fail-fast

  pkg:
    name: pkg (macos arm64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/dnsy/browser/index.html
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
      - name: Build the pkg
        run: dist build --artifacts=local --target=aarch64-apple-darwin
      - name: Install the pkg and run dnsy
        run: |
          set -euo pipefail
          pkg=target/distrib/dnsy-aarch64-apple-darwin.pkg
          test -f "$pkg"
          pkgutil --check-signature "$pkg" || true
          sudo installer -pkg "$pkg" -target / -verbose
          pkgutil --files dev.dnsy.dnsy
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          out=$(dnsy version)
          echo "$out"
          case "$out" in *"$want"*) ;; *) echo "dnsy version does not mention $want" >&2; exit 1 ;; esac
          command -v dnsy

  msi:
    name: msi (windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI
        shell: bash
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/dnsy/browser/index.html
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install dist
        run: powershell -c "irm https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.ps1 | iex"
      - name: Build the msi
        run: dist build --artifacts=local --target=x86_64-pc-windows-msvc
      - name: Install the msi, run dnsy, uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'target/distrib/dnsy-x86_64-pc-windows-msvc.msi').Path
          $exe = 'C:\Program Files\dnsy\bin\dnsy.exe'
          function Run-Msi($msiArgs) {
            $p = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec $msiArgs exited with $($p.ExitCode)" }
          }
          Run-Msi "/i `"$msi`" /qn /l*v install.log"
          if (-not (Test-Path $exe)) { throw "$exe was not installed" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $entries = $machinePath -split ';' | ForEach-Object { $_.TrimEnd('\') }
          if ($entries -notcontains 'C:\Program Files\dnsy\bin') { throw "install dir is not on the machine PATH: $machinePath" }
          $want = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $out = & $exe version
          Write-Host $out
          if (($out | Out-String) -notmatch [regex]::Escape($want)) { throw "dnsy version does not mention $want" }
          Run-Msi "/x `"$msi`" /qn /l*v uninstall.log"
          if (Test-Path $exe) { throw "$exe still present after uninstall" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -like '*Program Files\dnsy*') { throw "PATH entry left after uninstall: $machinePath" }
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: |
            install.log
            uninstall.log
          if-no-files-found: ignore
